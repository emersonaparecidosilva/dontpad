<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dontpad</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; font-family: monospace; }
        #notepad {
            width: 100%;
            height: 100vh;
            padding: 20px;
            padding-right: 90px; /* Evita que o texto fique por baixo do botão */
            font-size: 16px;
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
            background-color: #fcfcfc;
            color: #222;
        }
        #copy-btn {
            position: fixed;
            top: 12px;
            right: 15px;
            padding: 5px 10px;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            background-color: rgba(240, 240, 240, 0.7);
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, background-color 0.2s, color 0.2s;
        }
        #copy-btn:hover {
            opacity: 1;
            background-color: #eee;
            color: #222;
        }
        #status {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            color: #888;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <button id="copy-btn" title="Copiar todo o texto">Copiar</button>
    <textarea id="notepad" placeholder="Carregando..."></textarea>
    <div id="status">Carregando...</div>

    <script>
        const textarea = document.getElementById('notepad');
        const status = document.getElementById('status');
        const copyBtn = document.getElementById('copy-btn');
        const currentPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
        document.title = `Dontpad - /${currentPath}`;
        let timeout = null;

        // 1. Busca o conteúdo específico da URL atual ao abrir a página
        fetch(`/api/index?action=get&path=${encodeURIComponent(currentPath)}`)
            .then(res => res.json())
            .then(data => {
                textarea.value = data.content || '';
                textarea.placeholder = 'Digite seu texto aqui...';
                status.innerText = 'Salvo';
            })
            .catch(() => {
                textarea.placeholder = 'Digite seu texto aqui...';
                status.innerText = 'Erro ao carregar';
            });

        // 2. Salva automaticamente após 500ms sem digitar
        textarea.addEventListener('input', () => {
            status.innerText = 'Salvando...';
            clearTimeout(timeout);
            timeout = setTimeout(saveContent, 500);
        });

        function saveContent() {
            fetch(`/api/index?path=${encodeURIComponent(currentPath)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: textarea.value })
            })
            .then(res => res.json())
            .then(data => {
                status.innerText = data.status === 'success' ? 'Salvo' : 'Erro ao salvar!';
            })
            .catch(() => {
                status.innerText = 'Erro ao salvar!';
            });
        }

        // 3. Copiar conteúdo para a área de transferência
        copyBtn.addEventListener('click', () => {
            if (!textarea.value) return;

            navigator.clipboard.writeText(textarea.value).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'Copiado!';
                copyBtn.style.opacity = '1';
                
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.opacity = '';
                }, 1500);
            }).catch(() => {
                // Fallback para navegadores sem suporte à Clipboard API
                textarea.select();
                document.execCommand('copy');
            });
        });
    </script>
</body>
</html>
