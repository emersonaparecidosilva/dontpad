<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padeas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: monospace;
            display: flex;
            background-color: #fcfcfc;
        }

        /* Barra lateral à esquerda */
        #sidebar {
            width: 220px;
            height: 100vh;
            background-color: #f3f3f3;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            transition: width 0.2s, padding 0.2s;
            overflow: hidden;
            flex-shrink: 0;
        }
        #sidebar.collapsed {
            width: 0;
            border-right: none;
        }
        #sidebar-header {
            padding: 14px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
        }
        #links-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 8px 0;
        }
        #links-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 8px;
            transition: background-color 0.15s;
        }
        #links-list li:hover {
            background-color: #e6e6e6;
        }
        #links-list li.active-item {
            background-color: #e0e0e0;
            border-left: 3px solid #333;
        }
        #links-list li a {
            flex: 1;
            display: block;
            padding: 7px 10px 7px 15px;
            font-size: 13px;
            color: #444;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #links-list li.active-item a {
            font-weight: bold;
            color: #000;
        }
        .del-btn {
            background: none;
            border: none;
            color: #999;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s, background-color 0.15s;
        }
        #links-list li:hover .del-btn {
            opacity: 1;
        }
        .del-btn:hover {
            color: #d9534f;
            background-color: rgba(217, 83, 79, 0.12);
        }

        /* Área principal do editor */
        #main {
            flex: 1;
            position: relative;
            height: 100vh;
        }
        #notepad {
            width: 100%;
            height: 100%;
            padding: 20px;
            padding-top: 48px;
            font-size: 16px;
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
            background-color: #fcfcfc;
            color: #222;
        }

        /* Botões superiores discretos */
        .top-btn {
            position: absolute;
            top: 10px;
            padding: 5px 10px;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            background-color: rgba(240, 240, 240, 0.8);
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.65;
            transition: opacity 0.2s, background-color 0.2s;
            z-index: 10;
        }
        .top-btn:hover {
            opacity: 1;
            background-color: #eee;
            color: #222;
        }
        #toggle-sidebar { left: 15px; }
        #lock-btn { right: 80px; }
        #lock-btn.is-locked {
            color: #b45309;
            border-color: #f59e0b;
            background-color: #fef3c7;
            opacity: 0.9;
        }
        #copy-btn { right: 15px; }
        #status {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            color: #888;
            pointer-events: none;
        }

        /* Tela de desbloqueio por senha */
        #lock-overlay {
            position: absolute;
            inset: 0;
            background-color: #fcfcfc;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }
        #lock-box {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        #lock-box h3 {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }
        #lock-box p {
            font-size: 12px;
            color: #777;
            margin-bottom: 16px;
        }
        #unlock-input {
            width: 100%;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            outline: none;
        }
        #unlock-input:focus {
            border-color: #555;
        }
        #unlock-submit {
            width: 100%;
            padding: 9px;
            font-family: monospace;
            font-size: 13px;
            background-color: #222;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #unlock-submit:hover {
            background-color: #444;
        }
        #lock-error {
            color: #d9534f;
            font-size: 12px;
            margin-top: 10px;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div id="sidebar-header">
            <span>Páginas</span>
            <a href="/" style="text-decoration:none; color:#666; font-weight:normal; font-size:11px;" title="Ir para raiz">/raiz</a>
        </div>
        <ul id="links-list"></ul>
    </aside>

    <main id="main">
        <button id="toggle-sidebar" class="top-btn" title="Mostrar/Ocultar menu lateral">☰</button>
        <button id="lock-btn" class="top-btn" title="Definir ou remover senha">Travar</button>
        <button id="copy-btn" class="top-btn" title="Copiar todo o texto">Copiar</button>
        
        <textarea id="notepad" placeholder="Carregando..."></textarea>
        <div id="status">Carregando...</div>

        <!-- Tela de senha quando a nota está protegida -->
        <div id="lock-overlay">
            <div id="lock-box">
                <h3>Página Protegida</h3>
                <p id="lock-subtitle">Digite a senha para acessar este conteúdo.</p>
                <form id="unlock-form">
                    <input type="password" id="unlock-input" placeholder="Senha..." required autocomplete="current-password">
                    <button type="submit" id="unlock-submit">Desbloquear</button>
                </form>
                <div id="lock-error"></div>
            </div>
        </div>
    </main>

    <script>
        const textarea = document.getElementById('notepad');
        const status = document.getElementById('status');
        const copyBtn = document.getElementById('copy-btn');
        const lockBtn = document.getElementById('lock-btn');
        const linksList = document.getElementById('links-list');
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');

        const lockOverlay = document.getElementById('lock-overlay');
        const unlockForm = document.getElementById('unlock-form');
        const unlockInput = document.getElementById('unlock-input');
        const lockError = document.getElementById('lock-error');

        const currentPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
        document.title = currentPath ? `Padeas - /${currentPath}` : 'Padeas';
        
        let timeout = null;
        let isPageLocked = false;

        // Armazena a senha da sessão atual por rota
        function getSavedPassword(path) {
            return sessionStorage.getItem(`padeas_pwd_${path}`) || '';
        }
        function setSavedPassword(path, pwd) {
            if (pwd) {
                sessionStorage.setItem(`padeas_pwd_${path}`, pwd);
            } else {
                sessionStorage.removeItem(`padeas_pwd_${path}`);
            }
        }

        function updateLockButtonUI(locked) {
            isPageLocked = locked;
            if (locked) {
                lockBtn.innerText = 'Protegida';
                lockBtn.classList.add('is-locked');
                lockBtn.title = 'Clique para alterar ou remover a senha';
            } else {
                lockBtn.innerText = 'Travar';
                lockBtn.classList.remove('is-locked');
                lockBtn.title = 'Proteger esta página com senha';
            }
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Excluir página
        function deletePage(pathToDelete) {
            if (!confirm(`Deseja excluir permanentemente a página "/${pathToDelete}"?`)) return;

            fetch(`/api/index?action=delete&path=${encodeURIComponent(pathToDelete)}`, {
                method: 'DELETE',
                headers: { 'X-Note-Password': getSavedPassword(pathToDelete) }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    setSavedPassword(pathToDelete, '');
                    if (pathToDelete === currentPath) {
                        window.location.href = '/';
                    } else {
                        loadSidebarLinks();
                    }
                } else if (data.status === 'locked') {
                    alert('Esta página está protegida por senha. Abra e desbloqueie a página antes de excluí-la.');
                }
            });
        }

        // Carregar lista lateral
        function loadSidebarLinks() {
            fetch('/api/index?action=list')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        linksList.innerHTML = '';
                        const itemsMap = new Map();
                        data.items.forEach(item => itemsMap.set(item.path, item.locked));

                        if (currentPath && currentPath !== 'api/index' && !itemsMap.has(currentPath)) {
                            itemsMap.set(currentPath, isPageLocked);
                        }

                        Array.from(itemsMap.keys()).sort().forEach(p => {
                            const locked = itemsMap.get(p);
                            const li = document.createElement('li');
                            if (p === currentPath) li.classList.add('active-item');

                            const a = document.createElement('a');
                            a.href = `/${p}`;
                            a.textContent = locked ? `🔒 /${p}` : `/${p}`;
                            a.title = `/${p}`;

                            const delBtn = document.createElement('button');
                            delBtn.className = 'del-btn';
                            delBtn.textContent = '×';
                            delBtn.title = `Excluir /${p}`;
                            delBtn.onclick = (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                deletePage(p);
                            };

                            li.appendChild(a);
                            li.appendChild(delBtn);
                            linksList.appendChild(li);
                        });
                    }
                });
        }

        // Carregar conteúdo da nota atual
        function loadNote(isRetry = false) {
            fetch(`/api/index?action=get&path=${encodeURIComponent(currentPath)}`, {
                headers: { 'X-Note-Password': getSavedPassword(currentPath) }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'locked') {
                    lockOverlay.style.display = 'flex';
                    textarea.value = '';
                    status.innerText = 'Bloqueado';
                    if (isRetry) {
                        lockError.innerText = 'Senha incorreta. Tente novamente.';
                    }
                    unlockInput.focus();
                    loadSidebarLinks();
                } else if (data.status === 'success') {
                    lockOverlay.style.display = 'none';
                    lockError.innerText = '';
                    textarea.value = data.content || '';
                    textarea.placeholder = 'Digite seu texto aqui...';
                    status.innerText = 'Salvo';
                    updateLockButtonUI(data.locked);
                    loadSidebarLinks();
                }
            })
            .catch(() => {
                textarea.placeholder = 'Digite seu texto aqui...';
                status.innerText = 'Erro ao carregar';
            });
        }

        // Submissão do formulário de desbloqueio
        unlockForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pwd = unlockInput.value;
            setSavedPassword(currentPath, pwd);
            unlockInput.value = '';
            loadNote(true);
        });

        // Definir ou remover senha
        lockBtn.addEventListener('click', () => {
            if (isPageLocked) {
                const action = prompt('Esta página está protegida.\n- Digite uma NOVA senha para alterar\n- Deixe em branco e clique em OK para REMOVER a senha:');
                if (action === null) return; // Cancelado

                fetch(`/api/index?action=set_password&path=${encodeURIComponent(currentPath)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Note-Password': getSavedPassword(currentPath)
                    },
                    body: JSON.stringify({ new_password: action })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setSavedPassword(currentPath, action.trim());
                        updateLockButtonUI(data.locked);
                        loadSidebarLinks();
                        alert(data.locked ? 'Senha atualizada!' : 'Proteção por senha removida!');
                    }
                });
            } else {
                const newPwd = prompt('Digite uma senha para proteger esta página:');
                if (!newPwd || !newPwd.trim()) return;

                fetch(`/api/index?action=set_password&path=${encodeURIComponent(currentPath)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Note-Password': getSavedPassword(currentPath)
                    },
                    body: JSON.stringify({ new_password: newPwd.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        setSavedPassword(currentPath, newPwd.trim());
                        updateLockButtonUI(true);
                        loadSidebarLinks();
                        alert('Página protegida com sucesso!');
                    }
                });
            }
        });

        // Auto-save
        textarea.addEventListener('input', () => {
            status.innerText = 'Salvando...';
            clearTimeout(timeout);
            timeout = setTimeout(saveContent, 500);
        });

        function saveContent() {
            fetch(`/api/index?path=${encodeURIComponent(currentPath)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Note-Password': getSavedPassword(currentPath)
                },
                body: JSON.stringify({ content: textarea.value })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    status.innerText = 'Salvo';
                    loadSidebarLinks();
                } else if (data.status === 'locked') {
                    status.innerText = 'Bloqueado!';
                    loadNote();
                } else {
                    status.innerText = 'Erro ao salvar!';
                }
            })
            .catch(() => {
                status.innerText = 'Erro ao salvar!';
            });
        }

        // Copiar
        copyBtn.addEventListener('click', () => {
            if (!textarea.value) return;
            navigator.clipboard.writeText(textarea.value).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'Copiado!';
                copyBtn.style.opacity = '1';
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.opacity = '';
                }, 1500);
            }).catch(() => {
                textarea.select();
                document.execCommand('copy');
            });
        });

        // Inicializar
        loadNote();
        
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
